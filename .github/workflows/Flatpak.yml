name: Build Flatpak

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder imagemagick ostree

      - name: Configure Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Show manifest
        run: |
          ls -la flatpak/
          cat flatpak/org.joinloops.Loops.yaml

      - name: Resize icon
        run: |
          if [ -f flatpak/org.joinloops.Loops.png ]; then
            convert flatpak/org.joinloops.Loops.png -resize 512x512 flatpak/org.joinloops.Loops.png
          fi

      - name: Build application
        run: |
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --disable-rofiles-fuse \
            --repo=repo \
            build-dir flatpak/org.joinloops.Loops.yaml

      - name: Check build
        run: |
          echo "=== Installed files ==="
          find build-dir/files -maxdepth 4 -type f -print | head -100
          echo "=== Repository refs ==="
          ostree refs --repo=repo
          echo "=== Build size ==="
          du -sh build-dir/files

      - name: Create Flatpak bundle
        run: |
          REF=$(ostree refs

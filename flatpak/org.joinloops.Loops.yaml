app-id: org.joinloops.Loops
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: loops

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --env=GST_PLUGIN_FEATURE_RANK=vah264dec:512,vah265dec:512,vavp9dec:512,vaav1dec:512,vavp8dec:512,vapostproc:512,avdec_h264:256,avdec_hevc:256,avdec_vp9:256,avdec_aac:256
  - --filesystem=xdg-download

modules:
  - name: loops
    buildsystem: simple
    build-commands:
      - install -Dm755 gtk4-app/main.py /app/bin/loops
      - install -Dm644 gtk4-app/native_app.py /app/bin/native_app.py
      - install -Dm644 gtk4-app/style.css /app/bin/style.css
      - install -Dm644 flatpak/org.joinloops.Loops.desktop /app/share/applications/org.joinloops.Loops.desktop
      - install -Dm644 flatpak/org.joinloops.Loops.metainfo.xml /app/share/metainfo/org.joinloops.Loops.metainfo.xml
      - cp -r flatpak/icons/* /app/share/icons/
      - install -Dm644 flatpak/org.joinloops.Loops.png /app/share/icons/hicolor/512x512/apps/org.joinloops.Loops.png
    sources:
      - type: dir
        path: ..

app-id: org.joinloops.Loops
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: loops

finish-args:
  - --share=ipc
  - --share=network
  - --env=PYTHONPATH=/app/lib/python3.14/site-packages
  - --own-name=org.mpris.MediaPlayer2.Loops
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --env=GST_PLUGIN_FEATURE_RANK=vah264dec:512,vah265dec:512,vavp9dec:512,vaav1dec:512,vavp8dec:512,vapostproc:512,avdec_h264:256,avdec_hevc:256,avdec_vp9:256,avdec_aac:256
  - --filesystem=xdg-download

modules:
  - name: loops
    buildsystem: simple
    build-commands:
      - install -Dm755 gtk4-app/main.py /app/bin/loops
      - install -Dm644 gtk4-app/native_app.py /app/bin/native_app.py
      - install -Dm644 gtk4-app/local_translation.py /app/bin/local_translation.py
      - install -Dm644 gtk4-app/style.css /app/bin/style.css
      - install -Dm644 flatpak/translation-licenses.txt /app/share/licenses/org.joinloops.Loops/translation-licenses.txt
      - install -Dm644 flatpak/org.joinloops.Loops.desktop /app/share/applications/org.joinloops.Loops.desktop
      - install -Dm644 flatpak/org.joinloops.Loops.metainfo.xml /app/share/metainfo/org.joinloops.Loops.metainfo.xml
      - cp -r flatpak/icons/* /app/share/icons/
      - install -Dm644 flatpak/org.joinloops.Loops.png /app/share/icons/hicolor/512x512/apps/org.joinloops.Loops.png
    sources:
      - type: dir
        path: ..
  - name: local-translation-runtime
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - python3 flatpak/install_translation_wheels.py --prefix /app --wheel-dir .
    sources:
      - type: dir
        path: ..
      - type: file
        url: https://files.pythonhosted.org/packages/0d/f4/d14d4ad8d1eac0e49aafcc11ff9ec83ac5758ae23acc526f15b73c980c19/ctranslate2-4.8.4-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
